<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quebra-cabeça</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body>
<section id="menu" class="screen center"><div id="deco" aria-hidden="true"></div><canvas id="logo" width="220" height="220" aria-hidden="true"></canvas><h1 class="title">Quebra-cabeça</h1><p class="sub">Sorteie uma foto e monte peça por peça.</p>
<button class="main big" id="mPlay">Jogar</button><button class="big" id="mSet">Configurações</button></section>
<section id="roulette" class="screen center"><h2 id="rname" style="margin:0"></h2>
<div id="grid"></div>
<img id="rprev" alt="Imagem sorteada" hidden>
<div class="row" id="r1"><button class="main big" id="spin">Girar roleta</button></div>
<div class="row" id="r2" hidden><button class="main" id="rGo">Jogar com esta imagem</button><button id="rAgain">Girar de novo</button></div>
<button id="rBack">Voltar</button></section>
<section id="levels" class="screen center"><h2 style="margin:0">Escolha a dificuldade</h2><div id="lvbox" class="center" style="padding:0"></div><button id="lBack">Voltar</button></section>
<section id="settings" class="screen center"><h2 style="margin:0">Configurações</h2>
<label class="set">Tema<select id="sTheme"><option value="auto">Automático</option><option value="light">Claro</option><option value="dark">Escuro</option></select></label>
<label class="set">Cronômetro<select id="sTimer"><option value="1">Mostrar</option><option value="0">Ocultar</option></select></label>
<label class="set">Sons<select id="sSound"><option value="1">Ligados</option><option value="0">Desligados</option></select></label>
<label class="set">Ajuda no encaixe<select id="sSnap"><option value="0">Pouca</option><option value="1">Normal</option><option value="2">Muita</option></select></label>
<button id="sClr">Apagar recordes</button><button class="main" id="sBack">Voltar</button></section>
<div id="game" class="screen"><header>
<button id="tomenu">Menu</button><button id="peek">Ver modelo</button><button id="shuf">Embaralhar</button><button id="hint">Dica (2)</button>
<span class="hud" id="hud">0:00 · 0/24</span>
</header>
<div id="stage"><div id="board"><div id="ghost"></div></div>
<div id="win"><div><h2>Pronto!</h2><p id="wt"></p><p id="wb"></p><button class="main" id="again">Jogar de novo</button> <button id="wmenu">Menu</button></div></div></div></div>
<script src="images.js"></script>
<script src="game.js"></script>
</body></html>
